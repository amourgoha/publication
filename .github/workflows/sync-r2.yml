name: Sync publication files to Cloudflare R2

on:
  push:
    branches:
      - "**"
    paths:
      - "**/*.avif"
      - "**/*.epub"
      - "**/*.gif"
      - "**/*.jpe"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.mobi"
      - "**/*.pdf"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.webp"
      - "**/*.zip"
      - ".github/workflows/sync-r2.yml"
      - "scripts/sync-publication-r2.sh"
  workflow_dispatch:
    inputs:
      sync_all:
        description: Re-upload every publication file and image
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publication-r2-production
  cancel-in-progress: false

env:
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'nice69' }}
  R2_OBJECT_PREFIX: publication

jobs:
  sync-r2:
    name: Sync changed publication files to R2
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: env
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          # The push event's `before` SHA can be more than one commit behind
          # (for example, after a merge), so retain all commit metadata for
          # the incremental diff while still lazy-fetching file blobs.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload changed files and remove deleted files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets['cloudflare-api-token'] || secrets.cloudflare_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.account_id || secrets.cloudflare_account_id }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          R2_SYNC_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_all || contains(github.event.commits.*.added, '.github/workflows/sync-r2.yml') || contains(github.event.commits.*.modified, '.github/workflows/sync-r2.yml') || contains(github.event.commits.*.added, 'scripts/sync-publication-r2.sh') || contains(github.event.commits.*.modified, 'scripts/sync-publication-r2.sh') }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing." >&2; exit 1; }
          bash scripts/sync-publication-r2.sh

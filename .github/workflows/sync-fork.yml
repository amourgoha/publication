name: Sync fork with upstream

on:
  schedule:
    # Run once a week, Sunday at 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fast-forward from the upstream repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository_metadata="$(gh api "repos/${GITHUB_REPOSITORY}")"
          upstream_url="$(jq -r '.parent.clone_url // empty' <<<"${repository_metadata}")"

          if [ -z "${upstream_url}" ]; then
            echo "${GITHUB_REPOSITORY} is not a GitHub fork, so there is no upstream to sync."
            exit 1
          fi

          fork_branch="$(jq -r '.default_branch' <<<"${repository_metadata}")"
          upstream_branch="$(jq -r '.parent.default_branch' <<<"${repository_metadata}")"
          git remote add upstream "${upstream_url}"
          git fetch upstream "${upstream_branch}"
          git merge --ff-only "upstream/${upstream_branch}"
          git push origin "${fork_branch}"
